name: Publish CLI

# Publishes traccia-cli to npm when a GitHub Release is published (not when the tag is
# pushed: release.yml only drafts the release, and npm publishes cannot be taken back).
# The CLI carries the app's version: packages/cli/package.json holds a placeholder that
# is replaced with the root package.json version, the one `npm version` bumped for the tag.
#
# Authentication is npm trusted publishing (OIDC), configured once on npmjs.com in the
# package's settings (Trusted publisher: this repository, workflow "publish-cli.yml"). The
# first release of the package must be published by hand from a machine (`npm login`,
# then `npm publish -w packages/cli --access public`), because the setting only exists for
# a package that is already on the registry.
on:
  release:
    types: [published]
  # By hand, for a release whose automatic run failed: publishes whatever version the
  # checked-out branch carries in package.json.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # trusted publishing exchanges the workflow identity for a publish token

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24 # npm 11.5+ is required for trusted publishing
          registry-url: https://registry.npmjs.org

      # Only the CLI workspace: the app's dependencies (Electron, native modules) are not needed.
      - run: npm ci -w packages/cli

      - run: npm run typecheck -w packages/cli

      # `npm pkg set` only edits the file: `npm version` would also re-run the install to
      # sync the lockfile, pulling in the app's native modules and their downloads.
      - name: Take the version from the root package.json
        run: npm pkg set version="$(node -p "require('./package.json').version")" -w packages/cli

      - run: npm run build -w packages/cli

      # The registry accepts the tarball and stages the version before it is readable; a
      # retried PUT then meets its own upload as 409 "Cannot publish over previously staged
      # version" (npm/cli#9889). That answer is a publish that landed, so the step treats it
      # as success once the version reads back, and fails on anything else.
      - name: Publish
        run: |
          set +e
          output=$(npm publish -w packages/cli --access public --provenance 2>&1)
          code=$?
          set -e
          printf '%s\n' "$output"
          if [ "$code" -ne 0 ] && ! printf '%s' "$output" | grep -q 'previously staged version'; then
            exit "$code"
          fi
          version=$(node -p "require('./packages/cli/package.json').version")
          for _ in $(seq 1 12); do
            if npm view "traccia-cli@$version" version >/dev/null 2>&1; then
              echo "traccia-cli@$version is on the registry"
              exit 0
            fi
            sleep 10
          done
          echo "traccia-cli@$version did not become readable within two minutes" >&2
          exit 1
