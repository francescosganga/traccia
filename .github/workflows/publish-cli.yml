name: Publish CLI

# Publishes traccia-cli to npm when a GitHub Release is published (not when the tag is
# pushed: release.yml only drafts the release, and npm publishes cannot be taken back).
# The CLI carries the app's version: packages/cli/package.json holds a placeholder that
# is replaced with the root package.json version, the one `npm version` bumped for the tag.
#
# Authentication is npm trusted publishing (OIDC), configured once on npmjs.com in the
# package's settings (Trusted publisher: this repository, workflow "publish-cli.yml"). The
# first release of the package must be published by hand from a machine (`npm login`,
# then `npm publish -w packages/cli --access public`), because the setting only exists for
# a package that is already on the registry.
on:
  release:
    types: [published]
  # By hand, for a release whose automatic run failed: publishes whatever version the
  # checked-out branch carries in package.json.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # trusted publishing exchanges the workflow identity for a publish token

# A manual retry and a release event must not upload the same version concurrently.
concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24 # npm 11.5+ is required for trusted publishing
          registry-url: https://registry.npmjs.org

      # Only the CLI workspace: the app's dependencies (Electron, native modules) are not needed.
      - run: npm ci -w packages/cli

      - run: npm run typecheck -w packages/cli

      # `npm pkg set` only edits the file: `npm version` would also re-run the install to
      # sync the lockfile, pulling in the app's native modules and their downloads.
      - name: Take the version from the root package.json
        run: npm pkg set version="$(node -p "require('./package.json').version")" -w packages/cli

      - run: npm run build -w packages/cli

      # npm scans accepted uploads before making them installable. Availability usually
      # takes minutes, sometimes more than fifteen; it is separate from upload success.
      # https://github.blog/changelog/2026-07-28-npm-publish-time-malware-scanning-and-dual-use-metadata/
      - name: Publish
        shell: bash
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          package="traccia-cli@$version"
          registry=https://registry.npmjs.org/

          # Only E404 means absent: authentication and network errors must stay visible.
          is_published() {
            local result
            if result=$(npm view "$package" version --json --registry="$registry" --prefer-online --fetch-retries=0 --fetch-timeout=15000 2>&1); then
              return 0
            fi
            if grep -q '"code": "E404"' <<< "$result"; then
              return 1
            fi
            printf '%s\n' "$result" >&2
            return 2
          }

          state=0
          is_published || state=$?
          if [ "$state" -eq 0 ]; then
            echo "$package is already on the registry; skipping publication"
            echo "$package was already available; no upload needed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          elif [ "$state" -ne 1 ]; then
            exit "$state"
          fi

          code=0
          output=$(npm publish -w packages/cli --access public --provenance --registry="$registry" 2>&1) || code=$?
          printf '%s\n' "$output"
          if [ "$code" -ne 0 ]; then
            # A staged-version conflict can come from an earlier upload, but does not
            # prove publication succeeded. Require registry visibility in that case.
            if ! grep -q 'E409\|409 Conflict' <<< "$output" || ! grep -q 'Cannot publish over previously staged version' <<< "$output"; then
              exit "$code"
            fi
          fi

          for attempt in $(seq 1 40); do
            state=0
            is_published || state=$?
            if [ "$state" -eq 0 ]; then
              echo "$package is on the registry"
              echo "$package is available on npm." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Waiting for npm availability ($attempt/40, registry status $state)"
            if [ "$attempt" -lt 40 ]; then sleep 30; fi
          done

          if [ "$code" -ne 0 ]; then
            echo "::error::$package had a staged-version conflict and is still unavailable. Check its status on npm before retrying."
            exit "$code"
          fi

          # npm accepted this upload. A slow scan or registry outage does not undo it;
          # report pending availability explicitly instead of encouraging another upload.
          echo "::warning::npm accepted $package, but availability is not confirmed after approximately 20 minutes. Check npm processing/review status; do not bump the version just to retry."
          echo "npm accepted $package. Availability is still unconfirmed: check npm processing/review status before announcing it as installable." >> "$GITHUB_STEP_SUMMARY"
