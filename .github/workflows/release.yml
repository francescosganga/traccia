name: Release

# Runs when a version tag is pushed (`npm version patch && git push --follow-tags`).
# Each architecture is built, signed and notarized on its own macOS runner, then the
# DMGs are attached to a draft GitHub Release, ready to be reviewed and published.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   CSC_LINK                     Developer ID Application certificate with its private
#                                key, exported from Keychain Access as .p12 and
#                                base64-encoded (`base64 -i cert.p12 | pbcopy`)
#   CSC_KEY_PASSWORD             password chosen when exporting the .p12
#   APPLE_ID                     Apple ID of the developer account
#   APPLE_APP_SPECIFIC_PASSWORD  app-specific password from account.apple.com
#   APPLE_TEAM_ID                10-character team ID (developer.apple.com > Membership)
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # the release job creates the GitHub Release with GITHUB_TOKEN

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # One runner per architecture: the native modules (sharp, onnxruntime-node,
          # ffmpeg-static) only ship the binaries of the host arch, so cross-building
          # x64 from an arm64 machine produces a broken app.
          - os: macos-latest # Apple Silicon
            arch: arm64
          - os: macos-15-intel # Intel
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - name: Package, sign and notarize
        run: npx electron-builder --mac --${{ matrix.arch }} --config electron-builder.yml --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # electron-builder only warns when it cannot sign or notarize; fail here
      # instead of shipping a DMG that Gatekeeper will reject.
      - name: Verify signature and notarization
        run: |
          app=$(ls -d dist/mac*/*.app)
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"

      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  # A single job creates the release: publishing from each build job in parallel
  # raced and produced two draft releases for the same tag.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the notes need the previous tag and the commits since

      - uses: actions/download-artifact@v4
        with:
          pattern: dmg-*
          merge-multiple: true
          path: dist

      - name: Create draft release
        run: |
          scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --draft --title "${GITHUB_REF_NAME#v}" --notes-file notes.md dist/*.dmg
        env:
          GH_TOKEN: ${{ github.token }}
