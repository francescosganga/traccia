appId: com.develee.traccia
productName: Traccia
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/*.map'
extraResources:
  - from: resources
    to: resources
  # Localized permission prompts: macOS reads <lang>.lproj/InfoPlist.strings from
  # Contents/Resources, overriding the English defaults set in mac.extendInfo below.
  - from: build/it.lproj
    to: it.lproj
asarUnpack:
  - node_modules/ffmpeg-static/**
  - node_modules/uiohook-napi/**
  - node_modules/onnxruntime-node/**
  - node_modules/sharp/**
  - node_modules/@img/**
mac:
  category: public.app-category.productivity
  # No arch here on purpose: it comes from the CLI (--arm64 / --x64) or defaults to
  # the host, because the native modules only work for the architecture they were
  # installed on. An arch list here would override the CLI flag.
  target: dmg
  icon: build/icon.png
  # Signed with the Developer ID certificate found in the keychain (or in CSC_LINK) and
  # notarized when APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID are set;
  # without them electron-builder skips both steps and the build is unsigned.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  extendInfo:
    NSMicrophoneUsageDescription: Needed to record your voice along with the screen.
    NSScreenCaptureUsageDescription: Needed to record the screen.
    LSUIElement: false
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
win:
  target: nsis
  icon: build/icon.png
