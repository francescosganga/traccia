appId: com.develee.traccia
productName: Traccia
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/*.map'
extraResources:
  - from: resources
    to: resources
  # Localized permission prompts: macOS reads <lang>.lproj/InfoPlist.strings from
  # Contents/Resources, overriding the English defaults set in mac.extendInfo below.
  - from: build/it.lproj
    to: it.lproj
asarUnpack:
  - node_modules/ffmpeg-static/**
  - node_modules/uiohook-napi/**
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: build/icon.png
  # Unsigned build for GitHub releases (no Apple Developer account required).
  identity: null
  hardenedRuntime: false
  extendInfo:
    NSMicrophoneUsageDescription: Needed to record your voice along with the screen.
    NSScreenCaptureUsageDescription: Needed to record the screen.
    LSUIElement: false
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
win:
  target: nsis
  icon: build/icon.png
publish:
  provider: github
